<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LotPulse — Терминал перекупщика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090b10;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f5f7fa;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 15% 10%, #162238 0%, #090b10 55%, #06070a 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
      overflow-x: hidden;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 14px 16px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }
    .status-indicator.online {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .status-indicator.offline {
      background: var(--red);
    }

    /* Glass Cards */
    .card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Tabs */
    .tab-content {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Lots Feed */
    .lot-card {
      display: flex;
      gap: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 12px;
      transition: transform 0.15s ease;
    }

    .lot-img {
      width: 88px;
      height: 88px;
      border-radius: 14px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .lot-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .lot-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lot-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .lot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .lot-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--green);
    }

    .lot-actions {
      display: flex;
      gap: 6px;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-strong);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }

    .btn-sm.primary {
      background: var(--accent);
      color: #041019;
      border: none;
    }

    /* Forms & Inputs */
    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #03111a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    /* Quick Model Chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    /* Calculator */
    .calc-result {
      padding: 14px;
      border-radius: 16px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .defect-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 8px;
      font-size: 13px;
    }

    .defect-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    /* Bottom Glass Nav */
    .nav-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 512px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px;
      background: rgba(15, 20, 30, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 10px 4px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-btn.active {
      background: var(--glass-strong);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo-dot"></div>
        <h1>LotPulse</h1>
      </div>
      <div class="status-pill">
        <div id="statusDot" class="status-indicator"></div>
        <span id="statusText">Подключение...</span>
      </div>
    </div>

    <!-- TAB 1: LIVE FEED -->
    <div id="tab-feed" class="tab-content active">
      <div class="card" style="padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 12px; color: var(--muted);">Активный поиск</div>
          <div id="activeQueryLabel" style="font-size: 14px; font-weight: 700;">Загрузка...</div>
        </div>
        <button class="btn-sm primary" onclick="loadLots(true)">Обновить</button>
      </div>
      <div id="lotsContainer">
        <div class="card" style="text-align: center; color: var(--muted); font-size: 13px;">
          Загружаем свежие объявления с вашего ПК...
        </div>
      </div>
    </div>

    <!-- TAB 2: RADAR SETTINGS -->
    <div id="tab-radar" class="tab-content">
      <div class="card">
        <div class="card-title">Настройка радара OLX</div>

        <div class="chips">
          <div class="chip" onclick="quickPreset('Google Pixel', 2000, 15000)">Google Pixel</div>
          <div class="chip" onclick="quickPreset('iPhone 13', 7000, 18000)">iPhone 13</div>
          <div class="chip" onclick="quickPreset('iPhone 15', 14000, 27000)">iPhone 15</div>
          <div class="chip" onclick="quickPreset('Samsung S23 Ultra', 12000, 26000)">S23 Ultra</div>
        </div>

        <div class="field">
          <label>Модель или ключевой запрос</label>
          <input type="text" id="fQuery" placeholder="Например: Google Pixel 7" />
        </div>

        <div class="row-2">
          <div class="field">
            <label>Цена от (₴)</label>
            <input type="number" id="fMin" value="2000" />
          </div>
          <div class="field">
            <label>Цена до (₴)</label>
            <input type="number" id="fMax" value="15000" />
          </div>
        </div>

        <div class="field">
          <label>Фильтр состояния</label>
          <select id="fCondition">
            <option value="good">Только без дефектов (отсеивать битые/iCloud/MDM)</option>
            <option value="any">Все подряд (включая под восстановление)</option>
          </select>
        </div>

        <button class="btn-main" onclick="saveRadar()">Запустить поиск сейчас</button>
      </div>

      <div class="card">
        <div class="card-title">Адрес туннеля ПК</div>
        <div class="field">
          <label>Ссылка из окна SSH / Cloudflare (если перезапускали туннель)</label>
          <input type="text" id="apiUrlInput" />
        </div>
        <button class="btn-sm" style="width: 100%; padding: 10px;" onclick="updateApiUrl()">Сохранить адрес сервера</button>
      </div>
    </div>

    <!-- TAB 3: DEFECT & PROFIT CALCULATOR -->
    <div id="tab-calc" class="tab-content">
      <div class="card">
        <div class="card-title">Калькулятор маржи и дефектов</div>

        <div class="row-2">
          <div class="field">
            <label>Цена покупки (₴)</label>
            <input type="number" id="cBuy" value="8500" oninput="recalc()" />
          </div>
          <div class="field">
            <label>Рынок в идеале (₴)</label>
            <input type="number" id="cSell" value="13000" oninput="recalc()" />
          </div>
        </div>

        <div style="font-size: 12px; color: var(--muted); margin: 6px 0 8px;">Вычесть расходы на ремонт / комплект:</div>

        <label class="defect-toggle">
          <span>Замена стекла / дисплея (-3 200 ₴)</span>
          <input type="checkbox" data-cost="3200" onchange="recalc()" />
        </label>
        <label class="defect-toggle">
          <span>Замена аккумулятора (-900 ₴)</span>
          <input type="checkbox" data-cost="900" onchange="recalc()" />
        </label>
        <label class="defect-toggle">
          <span>Задняя крышка / корпус (-800 ₴)</span>
          <input type="checkbox" data-cost="800" onchange="recalc()" />
        </label>
        <label class="defect-toggle">
          <span>Стекло камеры / мелочи (-450 ₴)</span>
          <input type="checkbox" data-cost="450" onchange="recalc()" />
        </label>

        <div class="calc-result">
          <div>
            <div style="font-size: 12px; color: var(--muted);">Чистая прибыль</div>
            <div id="cProfit" style="font-size: 20px; font-weight: 800; color: var(--green);">+4 500 ₴</div>
          </div>
          <div style="text-align: right;">
            <div style="font-size: 12px; color: var(--muted);">Потолок выкупа</div>
            <div id="cMaxBuy" style="font-size: 15px; font-weight: 700;">10 500 ₴</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('feed', this)">
      <span>🔥</span>
      <span>Лента лотов</span>
    </button>
    <button class="nav-btn" onclick="switchTab('radar', this)">
      <span>📡</span>
      <span>Радар</span>
    </button>
    <button class="nav-btn" onclick="switchTab('calc', this)">
      <span>🧮</span>
      <span>Калькулятор</span>
    </button>
  </div>

  <script>
    const DEFAULT_API = "https://7d8ba7e424999b.lhr.life";
    let API_BASE = localStorage.getItem("lotpulse_api") || DEFAULT_API;

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    document.getElementById("apiUrlInput").value = API_BASE;

    function showToast(text) {
      const t = document.getElementById("toast");
      t.textContent = text;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2600);
    }

    function switchTab(name, btn) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
    }

    function updateApiUrl() {
      const val = document.getElementById("apiUrlInput").value.trim().replace(/\/$/, "");
      if (!val.startsWith("http")) {
        showToast("Введите корректную https:// ссылку");
        return;
      }
      API_BASE = val;
      localStorage.setItem("lotpulse_api", API_BASE);
      showToast("Адрес сервера обновлён");
      checkStatus();
      loadLots(true);
    }

    function quickPreset(q, min, max) {
      document.getElementById("fQuery").value = q;
      document.getElementById("fMin").value = min;
      document.getElementById("fMax").value = max;
    }

    async function checkStatus() {
      const dot = document.getElementById("statusDot");
      const txt = document.getElementById("statusText");
      try {
        const res = await fetch(API_BASE + "/api/status");
        const data = await res.json();
        dot.className = "status-indicator online";
        txt.textContent = "ПК Онлайн";
        if (data.filter) {
          document.getElementById("activeQueryLabel").textContent =
            `${data.filter.query} (${data.filter.min_price}–${data.filter.max_price} ₴)`;
          document.getElementById("fQuery").value = data.filter.query;
          document.getElementById("fMin").value = data.filter.min_price;
          document.getElementById("fMax").value = data.filter.max_price;
          document.getElementById("fCondition").value = data.filter.condition;
        }
      } catch (e) {
        dot.className = "status-indicator offline";
        txt.textContent = "Нет связи";
      }
    }

    async function loadLots(notify = false) {
      const container = document.getElementById("lotsContainer");
      try {
        const res = await fetch(API_BASE + "/api/lots?limit=30");
        const data = await res.json();
        const lots = data.lots || [];

        if (!lots.length) {
          container.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);font-size:13px;">Пока нет найденных лотов по этому запросу. Попробуйте расширить бюджет во вкладке «Радар».</div>`;
          return;
        }

        container.innerHTML = lots.map(lot => {
          const img = lot.image || "https://via.placeholder.com/150/1e293b/94a3b8?text=OLX";
          return `
            <div class="lot-card">
              <img class="lot-img" src="${img}" alt="" onerror="this.src='https://via.placeholder.com/150/1e293b/94a3b8?text=OLX'"/>
              <div class="lot-info">
                <div>
                  <div class="lot-title">${lot.title}</div>
                  <div class="lot-meta">📍 ${lot.city}</div>
                </div>
                <div class="lot-bottom">
                  <div class="lot-price">${lot.price.toLocaleString("ru-RU")} ₴</div>
                  <div class="lot-actions">
                    <button class="btn-sm" onclick="sendToCalc(${lot.price})">Расчёт</button>
                    <a class="btn-sm primary" href="${lot.url}" target="_blank">OLX ↗</a>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

        if (notify) showToast("Лента обновлена");
      } catch (e) {
        container.innerHTML = `<div class="card" style="text-align:center;color:var(--red);font-size:13px;">Не удалось подключиться к серверу на ПК. Проверьте, запущены ли radar.py и туннель.</div>`;
      }
    }

    async function saveRadar() {
      const payload = {
        query: document.getElementById("fQuery").value.trim() || "Google Pixel",
        min_price: parseInt(document.getElementById("fMin").value) || 1000,
        max_price: parseInt(document.getElementById("fMax").value) || 20000,
        condition: document.getElementById("fCondition").value,
        active: true
      };

      showToast("Сканирую OLX...");
      try {
        const res = await fetch(API_BASE + "/api/filters", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        showToast(`Готово! Найдено новых: ${data.added_now}`);
        await checkStatus();
        await loadLots(false);
        switchTab("feed", document.querySelectorAll(".nav-btn")[0]);
      } catch (e) {
        showToast("Ошибка связи с ПК");
      }
    }

    function sendToCalc(price) {
      document.getElementById("cBuy").value = price;
      document.getElementById("cSell").value = Math.round(price * 1.35 / 100) * 100;
      recalc();
      switchTab("calc", document.querySelectorAll(".nav-btn")[2]);
    }

    function recalc() {
      const buy = parseFloat(document.getElementById("cBuy").value) || 0;
      const sell = parseFloat(document.getElementById("cSell").value) || 0;
      let repairs = 0;
      document.querySelectorAll("#tab-calc input[type='checkbox']:checked").forEach(cb => {
        repairs += parseFloat(cb.dataset.cost) || 0;
      });
      const profit = sell - buy - repairs;
      const maxBuy = Math.max(0, sell - repairs - 2500);

      const pEl = document.getElementById("cProfit");
      pEl.textContent = (profit >= 0 ? "+" : "") + profit.toLocaleString("ru-RU") + " ₴";
      pEl.style.color = profit >= 0 ? "var(--green)" : "var(--red)";
      document.getElementById("cMaxBuy").textContent = maxBuy.toLocaleString("ru-RU") + " ₴";
    }

    checkStatus();
    loadLots(false);
    recalc();
    setInterval(loadLots, 30000);
  </script>
</body>
</html>
