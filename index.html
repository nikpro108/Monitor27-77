<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LotPulse — Терминал перекупщика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --glass: rgba(255, 255, 255, 0.065);
      --glass-strong: rgba(255, 255, 255, 0.13);
      --border: rgba(255, 255, 255, 0.14);
      --border-light: rgba(255, 255, 255, 0.24);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 88% 22%, rgba(52, 211, 153, 0.1) 0%, transparent 40%),
        linear-gradient(180deg, #0b101b 0%, #07090e 100%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 125px;
      overflow-x: hidden;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
    }

    /* PIN Lock Modal */
    .pin-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 14, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pin-overlay.open {
      display: flex;
    }
    .pin-box {
      width: 100%;
      max-width: 400px;
      background: rgba(20, 27, 42, 0.92);
      border: 1px solid var(--border-light);
      border-radius: 26px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 13px 16px;
      background: var(--glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-top-color: var(--border-light);
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #03111a;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--amber);
    }
    .status-indicator.online {
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
    }
    .status-indicator.offline {
      background: var(--red);
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-top-color: var(--border-light);
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.18s ease;
    }
    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lot-card {
      display: flex;
      gap: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 11px;
      margin-bottom: 10px;
    }

    .lot-img {
      width: 86px;
      height: 86px;
      border-radius: 14px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }

    .lot-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .lot-title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lot-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .lot-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 6px;
    }

    .lot-price {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--green);
      white-space: nowrap;
    }

    .lot-actions {
      display: flex;
      gap: 5px;
    }

    .btn-sm {
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-strong);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm.primary {
      background: var(--accent);
      color: #041019;
      border: none;
    }

    .market-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .market-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .market-name {
      font-size: 15px;
      font-weight: 700;
    }

    .market-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(52, 211, 153, 0.15);
      color: var(--green);
      font-weight: 700;
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 9px;
      border-radius: 12px;
    }

    .m-stat span {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
    }

    .m-stat strong {
      font-size: 13px;
      font-weight: 700;
    }

    .chart-box {
      width: 100%;
      height: 110px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .field {
      margin-bottom: 12
